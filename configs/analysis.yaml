# 공통 분석 설정. null 은 아직 결정되지 않은 항목 (PROJECT_CONTEXT.md 7·8절 참고)
sample:
  start: 2025-10-01
  end: null            # TODO: 실제 보유 데이터 최종 거래일로 확정

rv:
  bar_minutes: 5
  price_venue: KRX     # 가격·RV 는 KRX, 거래량은 ALL(KRX+NXT)
  volume_venue: ALL
  session: regular     # 09:00~15:19 연속매매
  include_closing_auction: false  # 주분석 rv5(정규장만). 강건성: rv5_close (2026-11-12)
  exclude_overnight: true
  dependent_variable:             # 2026-11-12. proc 에는 분산(rv5)만 있고 변환은 분석 코드에서
    rq1: log_rv
    rq2: log_rv
    rq3: [rv, log_rv]             # HAR 관례
    rq4: log_rv

split:
  shuffle: false       # 시계열은 날짜순 분할만 허용
