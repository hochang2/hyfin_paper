# RQ2 최종 추가 실험: 선택적 앙상블과 엄격한 표본 밖 검증 (src/rq2/phase1/ensemble)
# main_study · ml_extension · ml_followup 결과와 캐시는 읽기만 한다. 새 모형 적합은 없다.
# 이 파일은 결과를 보기 전에 고정했다 (2026-11-17). 값을 바꾸면 새 실험이다.

seed: 20261118
cache_dir: data/interim/rq_cache/ensemble     # 앙상블 온라인 예측 캐시 (Git 제외)
ext_cache_dir: data/interim/rq_cache/ml_ext         # 재사용: 13개 기본 모형 + FM + 기존 앙상블 (rv5, gk, space)
fu_cache_dir: data/interim/rq_cache/ml_followup     # 재사용: donor 가짜 개입일(exp1 local, exp3 FM zs), GK 조밀(exp5)

# ------------------------------------------------------------------ 후보 모형 풀 (단변량 FM·naive·튜닝 변형 제외)
pool:
  full: [bsts, ols, ridge, enet, lgbm, xgb, rf, uc, sarimax, harx, did_gap, chronos2_cov, timesfm_xreg]
  stat: [bsts, ols, ridge, uc, sarimax, harx]
  ml: [enet, lgbm, xgb, rf]
  fm: [chronos2_cov, timesfm_xreg]
  old_stack_members: [ols, ridge, bsts, sarimax, uc, harx, enet, rf, lgbm, xgb]   # ml_extension ens_stack 구성

# ------------------------------------------------------------------ 자료 (모두 기존 캐시)
datasets:
  gk:   {step: 10, windows: [h10, h30, post_effective]}          # 일별 GK, 3종목 x 238 가짜 개입일 (2016-06 ~ 2026-01)
  rv5:  {step: 3,  windows: [h10, h20, h30]}                      # 5분봉 rv5, 3종목 x 32 (발표 전에 끝나는 창만)
  rv5d: {step: 3,  windows: [h10, h20, h30]}                      # rv5 donor 20종목 (local + FM zs 가 모두 있는 종목), uc/sarimax 없음
  gkd:  {step: 3,  windows: [h10, h20, h30]}                      # GK 조밀 격자 (Exp5 감사), 8개 모형만
real_last_index: 190    # rv5 실제 발표일 위치. rv5·rv5d 가짜 창은 i0 + b <= 190 인 것만

# ------------------------------------------------------------------ 가중치 학습 (온라인, 미래 정보 없음)
# 가짜 개입일 i0 의 가중치 = 창이 i0 이전에 완전히 실현된 과거 과제(i0' + b <= i0)의 창평균 오차로만 학습.
online:
  min_past_rows: 9          # 과거 실현 창이 이보다 적으면 구성원 동일가중 (기록)
  min_past_rows_code: 5     # 종목별 가중치 최소 행
  hier_kappa: 5             # 계층 shrinkage: lambda = n_code_eff / (n_code_eff + kappa), n_eff = 비겹침 창 수
  bsts_shrink_kappa: 10     # BSTS 중심 shrinkage: alpha = n_eff / (n_eff + kappa)
  cap: 0.4                  # 최대 가중치 제한
  greedy_steps: 10          # Caruana 전진 선택 (복원)
  pair_mse_tol: 1.25        # 저상관 짝: 최고 모형 MSE 의 1.25 배 이내 후보 중 오차상관 최소
  regime_min_rows: 9        # 같은 국면 과거 행이 이보다 적으면 전역 가중치

# ------------------------------------------------------------------ 국면 (예측 시점 이전 관측값만)
regime:
  vol_lookback: 20          # donor 평균 log 변동성 20일 평균 (가짜 개입일 전날까지)
  ret_lookback: 20          # KOSPI 누적수익률 20일
  crash_q: 0.2              # 과거 가짜 개입일 분포의 20% 분위 미만 = 급락, 80% 초과 = 급등 (확장 분위)
  rally_q: 0.8
  gk_eras: ["2016-01-01", "2020-01-01", "2022-01-01", "2024-01-01"]   # 구조변화 묘사용 (가중치에 쓰지 않음)

# ------------------------------------------------------------------ Exp4 표본 밖 검증 (GK, 시간 순서 분할)
oos:
  gk_burnin_end: "2017-12-31"       # 가중치 예열. 평가 제외
  gk_select: ["2018-01-01", "2021-12-31"]   # 전략 선택 구간
  gk_holdout: ["2022-01-01", "2026-12-31"]  # 최종 평가 구간 (선택 후에만 계산)
  select_windows: [h10, h30, post_effective]   # 선정 기준 = 세 창의 BSTS 대비 상대 RMSE 평균
  rv5_eval_from: 120                # rv5·donor 평가 시작 가짜 개입일 (예열)
  boot_reps: 2000

# ------------------------------------------------------------------ Exp5 추론 감사 (ml_followup Exp5 블록 구조 그대로)
audit:
  block_n_cut: 32
  block_slide_days: 30
  min_eff: 3
  methods: [neff, strict]
  effects_pct: [-10, -20, -30, -40, -50, -60, -70, -80]
  gk10_block_n_cut: 10       # FM 포함 전략 감사: GK 10일 격자에서 가짜 10개 + 시험 1개
  gk10_block_slide: 3        # 격자점 단위

# ------------------------------------------------------------------ Exp6 실제 적용 — 사전 지정
real:
  codes: ["005930", "000660", "005935"]
  windows: {transition: h10, post_effective: post_effective}   # 실제 창 -> 가중치 학습에 쓰는 rv5 가짜 창
  best_single_rule: "rv5 발표 전 가짜 개입일 h10 RMSE (3종목 합산) 최소"
